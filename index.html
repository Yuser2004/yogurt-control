<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950 text-slate-100 selection:bg-emerald-500 selection:text-slate-950">
<head>

  <title>Yogurt Control</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              400: '#34d399',
              500: '#10b981',

              900: '#064e3b',

            'glow-card': '0 10px 30px -10px rgba(0, 0, 0, 0.5)',

      }
    }
  </script>

</head>
<body class="h-full flex flex-col justify-between font-sans antialiased overflow-hidden">

  <!-- SCRIPT LÓGICO DE LA APLICACIÓN -->
  <script>
    const SUPABASE_URL = 'https://diwidnmptmtaxaiclcxn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpd2lkbm1wdG10YXhhaWNsY3huIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5ODM5OTgsImV4cCI6MjEwNDU1OTk5OH0.iV1IVVyoOso2eacm9AZHQEAtpY5Ehu3Yf_MdN8xUEY4';
    
    const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    let currentUser = null;
    let clientsData = [];
    let currentFilter = 'aptos';
    let searchQuery = '';

    const clientListEl = document.getElementById('client-list');
    const modalEl = document.getElementById('client-modal');
    const ventaModalEl = document.getElementById('venta-modal');
    const detailModalEl = document.getElementById('detail-modal');
    const clientForm = document.getElementById('client-form');
    const ventaForm = document.getElementById('venta-form');
    const searchInput = document.getElementById('search-input');
    const aptosCountEl = document.getElementById('aptos-count');

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      setupEventListeners();
      checkSession();
    });

    function checkSession() {
      const savedUser = localStorage.getItem('yogurt_session');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        showAppScreen();
      } else {
        showLoginScreen();
      }
    }

    function showLoginScreen() {
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('app-screen').classList.add('hidden');
    }

    function showAppScreen() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      document.getElementById('user-display-name').innerText = currentUser.nombre;
      loadClients();
    }

    function logout() {
      localStorage.removeItem('yogurt_session');
      currentUser = null;
      showLoginScreen();
    }

    async function loadClients() {
      if (!supabaseClient || !currentUser) return;

      const { data, error } = await supabaseClient
        .from('clientes')
        .select(`
          *,
          yogurt_ventas (
            cantidad,
            monto_total
          )
        `)
        .eq('negocio_id', currentUser.negocio_id)
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error al cargar datos:', error);
        return;
      }

      // Procesar totales por cliente
      clientsData = (data || []).map(c => {
        const ventas = c.yogurt_ventas || [];
        const totalYogures = ventas.reduce((acc, v) => acc + (v.cantidad || 0), 0);
        const totalMonto = ventas.reduce((acc, v) => acc + (v.monto_total || 0), 0);
        return {
          ...c,
          total_yogures: totalYogures,
          total_monto: totalMonto
        };
      });

      // Definir Top 10 Clientes con más compras como VIPs
      const sortedByYogures = [...clientsData]
        .filter(c => c.total_yogures > 0)
        .sort((a, b) => b.total_yogures - a.total_yogures);

      const top10Ids = new Set(sortedByYogures.slice(0, 10).map(c => c.id));

      clientsData = clientsData.map(c => ({
        ...c,
        is_vip: top10Ids.has(c.id)
      }));

      renderClients();
    }

    function isApto(cliente) {
      if (!cliente.ultimo_ofrecimiento) return true;
      const fechaUltimo = new Date(cliente.ultimo_ofrecimiento);
      const hoy = new Date();
      const diffDias = (hoy - fechaUltimo) / (1000 * 60 * 60 * 24);
      return diffDias >= cliente.cooldown_days;
    }

    function getRemainingDays(cliente) {
      if (!cliente.ultimo_ofrecimiento) return 0;
      const fechaUltimo = new Date(cliente.ultimo_ofrecimiento);
      const hoy = new Date();
      const diffDias = Math.floor((hoy - fechaUltimo) / (1000 * 60 * 60 * 24));
      const restante = cliente.cooldown_days - diffDias;
      return restante > 0 ? restante : 0;
    }

    function renderClients() {
      clientListEl.innerHTML = '';

      const totalAptos = clientsData.filter(c => isApto(c)).length;
      const totalOfrecidos = clientsData.length - totalAptos;
      const totalVip = clientsData.filter(c => c.is_vip).length;
      const totalTodos = clientsData.length;

      aptosCountEl.innerText = totalAptos;

      document.getElementById('tab-aptos').querySelector('span').innerText = `Aptos (${totalAptos})`;
      document.getElementById('tab-ofrecidos').querySelector('span').innerText = `Espera (${totalOfrecidos})`;
      document.getElementById('tab-vip').querySelector('span').innerText = `Top VIP (${totalVip})`;
      document.getElementById('tab-todos').querySelector('span').innerText = `Todos (${totalTodos})`;

      let filtered = clientsData.filter(c => {
        const matchesSearch = c.nombre.toLowerCase().includes(searchQuery.toLowerCase()) || c.telefono.includes(searchQuery);
        const apto = isApto(c);

        if (!matchesSearch) return false;
        if (currentFilter === 'aptos') return apto;
        if (currentFilter === 'ofrecidos') return !apto;
        if (currentFilter === 'vip') return c.is_vip;
        return true;
      });

      // Ordenar clientes VIP de mayor a menor compras cuando estén en la pestaña VIP
      if (currentFilter === 'vip') {
        filtered.sort((a, b) => b.total_yogures - a.total_yogures);
      }

      if (filtered.length === 0) {
        clientListEl.innerHTML = `
          <div class="text-center py-16 space-y-3">
            <div class="w-14 h-14 bg-slate-900 border border-slate-800 rounded-3xl flex items-center justify-center mx-auto text-slate-500 shadow-inner">
              <i data-lucide="inbox" class="w-7 h-7 stroke-[1.5]"></i>
            </div>
            <p class="text-slate-400 text-sm font-medium">No hay registros aquí.</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      filtered.forEach((cliente, index) => {
        const apto = isApto(cliente);
        const diasRestantes = getRemainingDays(cliente);
        const card = document.createElement('div');
        card.className = 'glass-card rounded-3xl p-5 space-y-4 shadow-glow-card transition-all relative overflow-hidden';

        card.innerHTML = `
          <div class="flex items-start justify-between gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="text-xs font-black text-brand-400 bg-brand-500/10 border border-brand-500/20 px-2 py-0.5 rounded-lg">#${index + 1}</span>
                <h4 class="font-bold text-slate-100 text-base leading-snug">${cliente.nombre}</h4>
                ${cliente.is_vip ? `
                  <span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 text-[10px] font-black px-1.5 py-0.5 rounded-md flex items-center gap-1">
                    <i data-lucide="crown" class="w-3 h-3"></i> VIP
                  </span>
                ` : ''}
              </div>
              <p class="text-xs text-slate-400 font-mono flex items-center gap-1.5 pt-1">
                <i data-lucide="phone" class="w-3.5 h-3.5 text-slate-500"></i> ${cliente.telefono}
              </p>
            </div>

            <div class="flex items-center gap-1">
              <button onclick="openDetailModal('${cliente.id}')" class="p-2 text-slate-400 hover:text-amber-400 hover:bg-slate-800/60 rounded-xl transition-colors">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
              <button onclick="editClient('${cliente.id}')" class="p-2 text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 rounded-xl transition-colors">
                <i data-lucide="pencil" class="w-4 h-4"></i>
              </button>
              <button onclick="deleteClient('${cliente.id}')" class="p-2 text-slate-400 hover:text-rose-400 hover:bg-slate-800/60 rounded-xl transition-colors">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950/50 border border-slate-800/60 rounded-2xl px-3.5 py-2.5">
            <div>
              <span class="block text-[10px] uppercase text-slate-500 font-semibold">Total Yogures</span>
              <span class="text-emerald-400 font-black text-sm">${cliente.total_yogures || 0} un.</span>
            </div>
            <div class="text-right">
              <span class="block text-[10px] uppercase text-slate-500 font-semibold">Estado</span>
              ${apto ? `
                <span class="inline-flex items-center gap-1 text-[11px] font-bold text-emerald-400">
                  <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Apto
                </span>
              ` : `
                <span class="inline-flex items-center gap-1 text-[11px] font-bold text-amber-400">
                  <i data-lucide="hourglass" class="w-3 h-3"></i> Faltan ${diasRestantes}d
                </span>
              `}
            </div>
          </div>

          <div class="flex gap-2">
            <button 
              onclick="triggerWhatsApp('${cliente.id}')"
              class="flex-1 bg-gradient-to-r from-emerald-500 via-brand-500 to-teal-500 hover:brightness-110 active:scale-[0.98] text-slate-950 font-black py-3 rounded-2xl shadow-glow-brand flex items-center justify-center gap-2 transition-all"
            >
              <i data-lucide="message-circle" class="w-4 h-4 fill-slate-950 stroke-none"></i>
              <span>Ofrecer</span>
            </button>

            <button 
              onclick="openVentaModal('${cliente.id}')"
              class="bg-slate-800/90 hover:bg-slate-700 text-brand-400 border border-brand-500/20 font-bold px-3 py-3 rounded-2xl flex items-center justify-center gap-1.5 transition-all shadow-inner"
            >
              <i data-lucide="shopping-cart" class="w-4 h-4"></i>
              <span class="text-xs">Venta</span>
            </button>
          </div>
        `;

        clientListEl.appendChild(card);
      });

      lucide.createIcons();
    }

    async function triggerWhatsApp(id) {
      const cliente = clientsData.find(c => c.id === id);
      if (!cliente) return;

      const now = new Date().toISOString();

      if (supabaseClient) {
        await supabaseClient.from('clientes').update({ ultimo_ofrecimiento: now }).eq('id', id);
      }

      let phoneClean = cliente.telefono.replace(/\D/g, '');
      if (!phoneClean.startsWith('57') && phoneClean.length === 10) phoneClean = '57' + phoneClean;

      const cara = String.fromCodePoint(0x263A, 0xFE0F);
      const corazon = String.fromCodePoint(0x1F497);
      const rico = String.fromCodePoint(0x1F60B);
      const cuchara = String.fromCodePoint(0x1F944);
      const fresa = String.fromCodePoint(0x1F353);

      const mensaje = 
        `Hola, ${cliente.nombre} ${cara}${corazon} ¿Cómo estás?`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(mensaje).catch(() => {});
      }

      window.open(`https://api.whatsapp.com/send?phone=${phoneClean}&text=${encodeURIComponent(mensaje)}`, '_blank');
      await loadClients();
    }

    function openVentaModal(clientId) {
      document.getElementById('venta-client-id').value = clientId;
      document.getElementById('form-cantidad').value = '1';
      document.getElementById('form-precio-unitario').value = '13000';
      document.getElementById('form-estado-pago').value = 'pagado';
      ventaModalEl.classList.remove('hidden');
      ventaModalEl.classList.add('flex');
    }

    function closeVentaModal() {
      ventaModalEl.classList.add('hidden');
      ventaModalEl.classList.remove('flex');
    }

    async function openDetailModal(clientId) {
      const cliente = clientsData.find(c => c.id === clientId);
      if (!cliente) return;

      document.getElementById('detail-client-name').innerText = cliente.nombre;
      document.getElementById('detail-client-phone').innerText = cliente.telefono;
      document.getElementById('detail-total-yogures').innerText = `${cliente.total_yogures || 0} un.`;
      document.getElementById('detail-monto-total').innerText = `$${(cliente.total_monto || 0).toLocaleString('es-CO')}`;

      const listContainer = document.getElementById('detail-ventas-list');
      listContainer.innerHTML = `<p class="text-xs text-slate-500">Cargando compras...</p>`;

      detailModalEl.classList.remove('hidden');
      detailModalEl.classList.add('flex');

      if (supabaseClient) {
        const { data: ventas, error } = await supabaseClient
          .from('yogurt_ventas')
          .select('*')
          .eq('cliente_id', clientId)
          .order('created_at', { ascending: false });

        if (error || !ventas || ventas.length === 0) {
          listContainer.innerHTML = `<p class="text-xs text-slate-500 text-center py-4">No hay ventas registradas aún.</p>`;
          return;
        }

        listContainer.innerHTML = '';
        ventas.forEach(v => {
          const fecha = new Date(v.created_at).toLocaleDateString('es-CO', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
          const esPendiente = v.estado_pago === 'pendiente';
          
          const item = document.createElement('div');
          item.className = 'flex items-center justify-between bg-slate-900/60 border border-slate-800/60 rounded-xl p-3 text-xs gap-2';
          item.innerHTML = `
            <div>
              <span class="font-bold text-slate-200 block">${v.cantidad} Yogurt(es)</span>
              <span class="text-[10px] text-slate-500 font-mono">${fecha}</span>
            </div>
            <div class="text-right flex items-center gap-2">
              <div>
                <span class="font-black text-brand-400 block">$${(v.monto_total || 0).toLocaleString('es-CO')}</span>
                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded ${!esPendiente ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'} uppercase">
                  ${v.estado_pago}
                </span>
              </div>
              ${esPendiente ? `
                <button 
                  onclick="marcarComoPagado('${v.id}', '${clientId}')"
                  class="bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-400 border border-emerald-500/30 p-1.5 rounded-lg transition-colors text-[10px] font-bold flex items-center gap-1"
                  title="Marcar como pagado"
                >
                  <i data-lucide="check" class="w-3.5 h-3.5"></i>
                  <span class="hidden sm:inline">Pagar</span>
                </button>
              ` : ''}
            </div>
          `;
          listContainer.appendChild(item);
        });

        lucide.createIcons();
      }
    }

    async function marcarComoPagado(ventaId, clienteId) {
      if (!supabaseClient) return;

      const { error } = await supabaseClient
        .from('yogurt_ventas')
        .update({ estado_pago: 'pagado' })
        .eq('id', ventaId);

      if (error) {
        console.error('Error al actualizar el pago:', error);
        alert('No se pudo actualizar el estado del pago.');
        return;
      }

      await loadClients();
      await openDetailModal(clienteId);
    }

    function closeDetailModal() {
      detailModalEl.classList.add('hidden');
      detailModalEl.classList.remove('flex');
    }

    function setupEventListeners() {
      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('login-username').value.trim().toLowerCase();
        const password = document.getElementById('login-password').value.trim();
        const errorEl = document.getElementById('login-error');

        errorEl.classList.add('hidden');

        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('usuarios')
            .select('*')
            .eq('username', username)
            .eq('password', password)
            .maybeSingle();

          if (data) {
            currentUser = data;
            localStorage.setItem('yogurt_session', JSON.stringify(currentUser));
            showAppScreen();
          } else {
            errorEl.classList.remove('hidden');
          }
        }
      });

      document.getElementById('btn-open-modal').addEventListener('click', () => openModal());
      document.getElementById('btn-close-modal').addEventListener('click', () => closeModal());
      document.getElementById('btn-cancel-modal').addEventListener('click', () => closeModal());

      clientForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('client-id').value;
        const nombre = document.getElementById('form-nombre').value.trim();
        const rawTelefono = document.getElementById('form-telefono').value.trim();
        const cooldown_days = parseInt(document.getElementById('form-cooldown').value);

        let telefono = rawTelefono.replace(/\D/g, '');
        if (!telefono) return alert('Por favor ingresa un número de teléfono válido.');

        if (supabaseClient) {
          if (id) {
            await supabaseClient.from('clientes').update({ nombre, telefono, cooldown_days }).eq('id', id);
          } else {
            await supabaseClient.from('clientes').insert([{ 
              nombre, 
              telefono, 
              cooldown_days, 
              negocio_id: currentUser.negocio_id 
            }]);
          }
        }

        closeModal();
        await loadClients();
      });

      ventaForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const cliente_id = document.getElementById('venta-client-id').value;
        const cantidad = parseInt(document.getElementById('form-cantidad').value) || 1;
        const precioUnitario = parseFloat(document.getElementById('form-precio-unitario').value) || 13000;
        const estado_pago = document.getElementById('form-estado-pago').value;

        if (supabaseClient && currentUser) {
          const montoTotal = precioUnitario * cantidad;

          const { error } = await supabaseClient
            .from('yogurt_ventas')
            .insert([{
              negocio_id: currentUser.negocio_id,
              cliente_id: cliente_id,
              cantidad: cantidad,
              precio_unitario: precioUnitario,
              monto_total: montoTotal,
              estado_pago: String(estado_pago)
            }]);

          if (error) {
            console.error('Error registrando venta:', error);
            alert('Hubo un problema registrando la venta.');
          } else {
            alert('¡Venta registrada con éxito!');
          }
        }

        closeVentaModal();
        await loadClients();
      });

      const tabs = [
        { btn: document.getElementById('tab-aptos'), filter: 'aptos' },
        { btn: document.getElementById('tab-ofrecidos'), filter: 'ofrecidos' },
        { btn: document.getElementById('tab-vip'), filter: 'vip' },
        { btn: document.getElementById('tab-todos'), filter: 'todos' }
      ];

      tabs.forEach(({ btn, filter }) => {
        btn.addEventListener('click', () => {
          currentFilter = filter;
          tabs.forEach(t => {
            t.btn.className = 'py-2.5 rounded-xl text-slate-400 hover:text-slate-200 transition-all flex flex-col sm:flex-row items-center justify-center gap-1 font-bold';
          });
          btn.className = 'py-2.5 rounded-xl bg-gradient-to-r from-emerald-500 to-brand-500 text-slate-950 shadow-md transition-all flex flex-col sm:flex-row items-center justify-center gap-1 font-bold';
          renderClients();
        });
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderClients();
      });
    }

    function openModal(editData = null) {
      if (editData) {
        document.getElementById('modal-title').innerText = 'Editar Cliente';
        document.getElementById('client-id').value = editData.id;
        document.getElementById('form-nombre').value = editData.nombre;
        document.getElementById('form-telefono').value = editData.telefono;
        document.getElementById('form-cooldown').value = editData.cooldown_days;
      } else {
        document.getElementById('modal-title').innerText = 'Nuevo Cliente';
        clientForm.reset();
        document.getElementById('client-id').value = '';
      }
      modalEl.classList.remove('hidden');
      modalEl.classList.add('flex');
    }

    function closeModal() {
      modalEl.classList.add('hidden');
      modalEl.classList.remove('flex');
    }

    function editClient(id) {
      const cliente = clientsData.find(c => c.id === id);
      if (cliente) openModal(cliente);
    }

    async function deleteClient(id) {
      if (confirm('¿Deseas eliminar este cliente?')) {
        if (supabaseClient) {
          await supabaseClient.from('clientes').delete().eq('id', id);
        }
        await loadClients();
      }
    }
  </script>
</body>
</html>
